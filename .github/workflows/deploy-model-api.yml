name: Deploy Model API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy
        required: true
        default: main
        type: string
      deploy_enabled:
        description: Run VPS deploy after image build
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-model-api
  cancel-in-progress: false

env:
  CONTAINER_REGISTRY: ghcr.io
  COMPOSE_FILE: docker-compose.production.yml
  RUNTIME_ENV_FILE: .env.production
  DEFAULT_MODEL_API_PORT: "3004"
  STOP_MODEL_API_BEFORE_PULL: "true"
  DEPLOY_TARGET: production
  EXPECTED_MODEL_API_ENV: production
  COMPOSE_PROJECT_NAME: bisakerja-model-api

jobs:
  build-and-push:
    name: Build And Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write

    outputs:
      deploy_branch: ${{ steps.meta.outputs.deploy_branch }}
      image_name: ${{ steps.meta.outputs.image_name }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      source_sha: ${{ steps.meta.outputs.source_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || github.ref }}

      - name: Resolve image metadata
        id: meta
        run: |
          set -euo pipefail

          deploy_branch="${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || github.ref_name }}"

          case "$deploy_branch" in
            main)
              ;;
            *)
              echo "::error::Unsupported production deploy branch: $deploy_branch"
              exit 1
              ;;
          esac

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="$deploy_branch"
          source_sha="$(git rev-parse HEAD)"

          {
            echo "deploy_branch=$deploy_branch"
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
            echo "image_ref=$image_name:sha-$source_sha"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          secret-envs: |
            HF_TOKEN=HF_TOKEN
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:sha-${{ steps.meta.outputs.source_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy To VPS
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_enabled == 'true') || (github.event_name == 'push' && vars.MODEL_API_CD_ENABLED != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.source_sha }}

      - name: Validate required deployment secrets
        env:
          DEPLOY_VPS_HOST: ${{ secrets.DEPLOY_VPS_HOST }}
          DEPLOY_VPS_PORT: ${{ secrets.DEPLOY_VPS_PORT }}
          DEPLOY_VPS_USERNAME: ${{ secrets.DEPLOY_VPS_USERNAME }}
          DEPLOY_VPS_KEY: ${{ secrets.DEPLOY_VPS_KEY }}
          DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          GHCR_READ_PACKAGES_TOKEN: ${{ secrets.GHCR_READ_PACKAGES_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          set -euo pipefail

          required=(
            DEPLOY_VPS_HOST
            DEPLOY_VPS_PORT
            DEPLOY_VPS_USERNAME
            DEPLOY_VPS_KEY
            DEPLOY_REMOTE_PATH
            DEPLOY_ENV_FILE
            GHCR_READ_PACKAGES_TOKEN
            GH_USERNAME
          )

          missing=0

          for secret_name in "${required[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Install SSH key
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.DEPLOY_VPS_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p '${{ secrets.DEPLOY_VPS_PORT }}' '${{ secrets.DEPLOY_VPS_HOST }}' >> ~/.ssh/known_hosts

      - name: Upload compose file
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p '${{ secrets.DEPLOY_VPS_PORT }}' '${{ secrets.DEPLOY_VPS_USERNAME }}@${{ secrets.DEPLOY_VPS_HOST }}' \
            "install -d -m 755 '${{ secrets.DEPLOY_REMOTE_PATH }}'"
          scp -i ~/.ssh/deploy_key -P '${{ secrets.DEPLOY_VPS_PORT }}' '${{ env.COMPOSE_FILE }}' \
            '${{ secrets.DEPLOY_VPS_USERNAME }}@${{ secrets.DEPLOY_VPS_HOST }}:${{ secrets.DEPLOY_REMOTE_PATH }}/${{ env.COMPOSE_FILE }}'

      - name: Deploy via SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p '${{ secrets.DEPLOY_VPS_PORT }}' '${{ secrets.DEPLOY_VPS_USERNAME }}@${{ secrets.DEPLOY_VPS_HOST }}' 'bash -seuo pipefail' <<'REMOTE_SCRIPT'

          REMOTE_PATH='${{ secrets.DEPLOY_REMOTE_PATH }}'
          RUNTIME_ENV_FILE='${{ env.RUNTIME_ENV_FILE }}'
          COMPOSE_FILE='${{ env.COMPOSE_FILE }}'
          MODEL_API_PORT='${{ env.DEFAULT_MODEL_API_PORT }}'
          MODEL_API_IMAGE='${{ needs.build-and-push.outputs.image_ref }}'
          COMPOSE_PROJECT_NAME='${{ env.COMPOSE_PROJECT_NAME }}'
          EXPECTED_MODEL_API_ENV='${{ env.EXPECTED_MODEL_API_ENV }}'

          install -d -m 755 "$REMOTE_PATH"
          cat <<'EOF' > "$REMOTE_PATH/$RUNTIME_ENV_FILE"
          ${{ secrets.DEPLOY_ENV_FILE }}
          EOF
          chmod 600 "$REMOTE_PATH/$RUNTIME_ENV_FILE"

          cd "$REMOTE_PATH"

          actual_env="$(
            awk -F= '
              $1 == "MODEL_API_ENV" {
                value=$2
                for (i=3; i<=NF; i++) value=value "=" $i
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                gsub(/^\"|\"$/, "", value)
                gsub(/^'\''|'\''$/, "", value)
                print value
                exit
              }
            ' "$RUNTIME_ENV_FILE"
          )"

          if [ -z "$actual_env" ]; then
            echo "MODEL_API_ENV is required in $RUNTIME_ENV_FILE" >&2
            exit 1
          fi

          if [ -n "$EXPECTED_MODEL_API_ENV" ] && [ "$actual_env" != "$EXPECTED_MODEL_API_ENV" ]; then
            echo "MODEL_API_ENV mismatch for deploy: expected $EXPECTED_MODEL_API_ENV but found $actual_env in $RUNTIME_ENV_FILE" >&2
            exit 1
          fi

          env_value() {
            awk -F= -v key="$1" '
              $1 == key {
                value=$2
                for (i=3; i<=NF; i++) value=value "=" $i
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                gsub(/^"|"$/, "", value)
                gsub(/^'\''|'\''$/, "", value)
                print value
                exit
              }
            ' "$RUNTIME_ENV_FILE"
          }

          artifact_root="$(env_value MODEL_API_ARTIFACT_ROOT)"
          expected_embedding="$(env_value MODEL_API_EXPECTED_EMBEDDING_MODEL)"
          warmup_required="$(env_value MODEL_API_WARMUP_REQUIRED)"
          warmup_on_startup="$(env_value MODEL_API_WARMUP_ON_STARTUP)"
          sentence_transformers_home="$(env_value SENTENCE_TRANSFORMERS_HOME)"

          if [ "$artifact_root" != "artifacts/phase_46_calibration_model_card_manifest_handoff_refresh" ]; then
            echo "MODEL_API_ARTIFACT_ROOT must be phase46 multilingual package for production deploy; actual=${artifact_root:-<unset>}" >&2
            exit 1
          fi

          if [ "$expected_embedding" != "intfloat/multilingual-e5-small" ]; then
            echo "MODEL_API_EXPECTED_EMBEDDING_MODEL must be intfloat/multilingual-e5-small for production deploy; actual=${expected_embedding:-<unset>}" >&2
            exit 1
          fi

          if [ "$warmup_required" = "true" ] && [ "$warmup_on_startup" != "true" ]; then
            echo "MODEL_API_WARMUP_REQUIRED=true requires MODEL_API_WARMUP_ON_STARTUP=true for deploy readiness gate" >&2
            exit 1
          fi

          if [ -n "$sentence_transformers_home" ] && [ "$sentence_transformers_home" != "/home/user/.cache/sentence-transformers" ]; then
            echo "SENTENCE_TRANSFORMERS_HOME must stay on image-baked cache path; actual=$sentence_transformers_home" >&2
            exit 1
          fi

          printf '%s' '${{ secrets.GHCR_READ_PACKAGES_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GH_USERNAME }}' --password-stdin

          if [ '${{ env.STOP_MODEL_API_BEFORE_PULL }}' = 'true' ]; then
            MODEL_API_IMAGE="$MODEL_API_IMAGE" \
            MODEL_API_PORT="$MODEL_API_PORT" \
            MODEL_API_ENV_FILE="$RUNTIME_ENV_FILE" \
            COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
              docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" down --remove-orphans || true
          fi

          docker container prune -f
          docker image prune -af
          docker builder prune -af || true

          MODEL_API_IMAGE="$MODEL_API_IMAGE" \
          MODEL_API_PORT="$MODEL_API_PORT" \
          MODEL_API_ENV_FILE="$RUNTIME_ENV_FILE" \
          COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" pull model-api

          MODEL_API_IMAGE="$MODEL_API_IMAGE" \
          MODEL_API_PORT="$MODEL_API_PORT" \
          MODEL_API_ENV_FILE="$RUNTIME_ENV_FILE" \
          COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" up -d --remove-orphans model-api

          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 --max-time 5 "http://127.0.0.1:${MODEL_API_PORT}/live" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "1" ] || [ $((attempt % 10)) -eq 0 ]; then
              echo "Waiting for Model API /live... attempt=${attempt}/60"
              docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" ps model-api || true
            fi
            sleep 5
          done

          if ! curl -fsS --connect-timeout 2 --max-time 5 "http://127.0.0.1:${MODEL_API_PORT}/live" >/dev/null 2>&1; then
            docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" ps model-api
            docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" logs --tail=150 model-api
            exit 1
          fi

          docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" ps model-api
          MODEL_API_IMAGE="$MODEL_API_IMAGE" \
          MODEL_API_PORT="$MODEL_API_PORT" \
          MODEL_API_ENV_FILE="$RUNTIME_ENV_FILE" \
          COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT_NAME" \
            docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" exec -T model-api \
              python -c "import sentence_transformers; print('sentence-transformers', sentence_transformers.__version__)"
          curl -fsS --connect-timeout 2 --max-time 10 "http://127.0.0.1:${MODEL_API_PORT}/health" || true

          ready_ok=0
          for attempt in $(seq 1 180); do
            if python -c 'import json, sys, urllib.request; port=sys.argv[1]; data=json.loads(urllib.request.urlopen(f"http://127.0.0.1:{port}/ready", timeout=5).read()); raise SystemExit(0 if data.get("ready") is True else 1)' "$MODEL_API_PORT" >/dev/null 2>&1; then
              ready_ok=1
              break
            fi
            if [ "$attempt" = "1" ] || [ $((attempt % 12)) -eq 0 ]; then
              echo "Waiting for Model API /ready... attempt=${attempt}/180"
              curl -fsS --connect-timeout 2 --max-time 10 "http://127.0.0.1:${MODEL_API_PORT}/ready" || true
            fi
            sleep 5
          done

          if [ "$ready_ok" -ne 1 ]; then
            echo "Model API live but not ready after readiness wait." >&2
            curl -fsS --connect-timeout 2 --max-time 10 "http://127.0.0.1:${MODEL_API_PORT}/ready" || true
            curl -fsS --connect-timeout 2 --max-time 10 "http://127.0.0.1:${MODEL_API_PORT}/health" || true
            docker compose -f "$COMPOSE_FILE" --env-file "$RUNTIME_ENV_FILE" logs --tail=150 model-api
            exit 1
          fi

          docker image prune -af --filter "until=24h"
          docker builder prune -af --filter "until=24h" || true
          exit 0
          REMOTE_SCRIPT

      - name: Collect remote diagnostics on failure
        if: failure()
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -p '${{ secrets.DEPLOY_VPS_PORT }}' '${{ secrets.DEPLOY_VPS_USERNAME }}@${{ secrets.DEPLOY_VPS_HOST }}' 'bash -s' <<'REMOTE_SCRIPT'
          cd '${{ secrets.DEPLOY_REMOTE_PATH }}' || exit 0
          docker compose -f '${{ env.COMPOSE_FILE }}' --env-file '${{ env.RUNTIME_ENV_FILE }}' ps model-api
          docker compose -f '${{ env.COMPOSE_FILE }}' --env-file '${{ env.RUNTIME_ENV_FILE }}' logs --tail=150 model-api
          REMOTE_SCRIPT
