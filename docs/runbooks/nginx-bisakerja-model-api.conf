# ============================================================
# Bisakerja Model API - Nginx Reverse Proxy
# Domain: bisakerja-model.salmanabdurrahman.my.id
# Upstream: FastAPI/Uvicorn on 127.0.0.1:3004
# ============================================================

# ============================================================
# Block 1: HTTP (Port 80) - Redirect to HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name bisakerja-model.salmanabdurrahman.my.id;

    # Let's Encrypt verification path for aaPanel
    location ~ /.well-known/acme-challenge/ {
        root /www/wwwroot/bisakerja-model.salmanabdurrahman.my.id;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# Upstream: Model API FastAPI/Uvicorn
# ============================================================
upstream bisakerja_model_api {
    server 127.0.0.1:3004;
    keepalive 32;
}

# ============================================================
# Block 2: HTTPS (Port 443) - Reverse Proxy to Model API
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bisakerja-model.salmanabdurrahman.my.id;

    # SSL Certificate (aaPanel path)
    ssl_certificate     /www/server/panel/vhost/cert/bisakerja-model.salmanabdurrahman.my.id/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/bisakerja-model.salmanabdurrahman.my.id/privkey.pem;

    # SSL Security Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression for JSON API
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Upload + Buffer Limits
    # Model API default PDF limit is 5 MB; keep Nginx slightly higher.
    client_max_body_size 10M;
    client_body_buffer_size 256k;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    # Health endpoint can be checked without Authorization header.
    location = /health {
        proxy_pass http://bisakerja_model_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://bisakerja_model_api;

        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep Authorization header for MODEL_API_SERVICE_TOKEN bearer auth.
        proxy_set_header Authorization $http_authorization;

        # Keep-Alive upstream
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # TensorFlow + E5 inference can be slow on cold start.
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Block sensitive files
    location ~ /\.(env|git|svn|ht|project|config) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Logging
    access_log  /www/wwwlogs/bisakerja-model.salmanabdurrahman.my.id.log;
    error_log   /www/wwwlogs/bisakerja-model.salmanabdurrahman.my.id.error.log warn;
}
