name: ${COMPOSE_PROJECT_NAME:-bisakerja-model-api}

services:
  model-api:
    image: ${MODEL_API_IMAGE:-ghcr.io/bisa-kerja/bisakerja-model:main}
    restart: unless-stopped
    env_file:
      - path: ${MODEL_API_ENV_FILE:-.env.production}
        required: true
    ports:
      - "${MODEL_API_BIND_ADDRESS:-127.0.0.1}:${MODEL_API_PORT:-3004}:7860"
    mem_limit: ${MODEL_API_MEM_LIMIT:-9g}
    environment:
      MODEL_API_MAX_CONCURRENT_INFERENCE: ${MODEL_API_MAX_CONCURRENT_INFERENCE:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-2}
      TF_NUM_INTRAOP_THREADS: ${TF_NUM_INTRAOP_THREADS:-2}
      TF_NUM_INTEROP_THREADS: ${TF_NUM_INTEROP_THREADS:-1}
      TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-false}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:--1}
      SENTENCE_TRANSFORMERS_HOME: ${SENTENCE_TRANSFORMERS_HOME:-/home/user/.cache/sentence-transformers}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/live', timeout=5).read()"
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
