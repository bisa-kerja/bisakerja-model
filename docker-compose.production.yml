name: ${COMPOSE_PROJECT_NAME:-bisakerja-model-api}

services:
  model-api:
    image: ${MODEL_API_IMAGE:-ghcr.io/bisa-kerja/bisakerja-model:main}
    restart: unless-stopped
    env_file:
      - path: ${MODEL_API_ENV_FILE:-.env.production}
        required: true
    ports:
      - "${MODEL_API_BIND_ADDRESS:-127.0.0.1}:${MODEL_API_PORT:-3004}:7860"
    mem_limit: ${MODEL_API_MEM_LIMIT:-8g}
    environment:
      SENTENCE_TRANSFORMERS_HOME: ${SENTENCE_TRANSFORMERS_HOME:-/home/user/.cache/sentence-transformers}
    volumes:
      - sentence-transformers-cache:/home/user/.cache/sentence-transformers
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; data=json.loads(urllib.request.urlopen('http://127.0.0.1:7860/ready', timeout=5).read()); raise SystemExit(0 if data.get('ready') is True else 1)"
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sentence-transformers-cache:
    driver: local
